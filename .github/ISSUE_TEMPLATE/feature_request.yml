name: Feature request
description: Propose a change. Please wait for a reply before opening a pull request.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why can't you do it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The smallest change that would solve it. Mention any new dependencies.
    validations:
      required: true
  - type: dropdown
    id: pr
    attributes:
      label: Would you open the pull request?
      options:
        - "Yes, once the maintainer agrees"
        - "No, just suggesting"
    validations:
      required: true
