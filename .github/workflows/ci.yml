name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      # CPU torch keeps CI small; unit tests use a fake encoder and never download the model
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # the built-in pack must be inside the wheel, not just the source tree
      - run: python -m build --wheel
      - run: python -c "import glob, sys, zipfile; n = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(any(x not in n for x in ['voicedecide/packs/language-id/pack.json', 'voicedecide/packs/language-id/prototype_sums.npy']))"
